[project]
name = "lattence-evidence"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "lattence-core", "pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lattence"]

[tool.uv.sources]
lattence-core = { workspace = true }
