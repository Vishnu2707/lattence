[project]
name = "lattence-core"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lattence"]
