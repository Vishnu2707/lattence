name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
      - run: uv sync --all-packages --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --all-packages --dev
      - run: uv run pytest --cov --cov-report=term-missing

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --all-packages --dev
      - run: uv run mypy --strict lattence-cli/src
      - run: uv run mypy --strict lattence-core/src/lattence/discovery
      - run: uv run mypy --strict lattence-core/src/lattence/graph
      - run: uv run mypy --strict lattence-crypto/src/lattence_crypto
      - run: uv run mypy --strict lattence-evidence
      - run: uv run mypy --strict lattence-mcp
      - run: uv run mypy --strict lattence-ai/src/lattence_ai/attacks
      - run: uv run mypy --strict lattence-api/src/lattence_api

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv build
      - run: python -m venv /tmp/lattence-acceptance
      - run: /tmp/lattence-acceptance/bin/pip install dist/*.whl
      - name: Run clean-wheel acceptance
        run: |
          export PATH="$GITHUB_WORKSPACE/tests/acceptance/bin:$PATH"
          cd examples/vulnerable-agent
          /tmp/lattence-acceptance/bin/lattence scan . --fail-on none
          /tmp/lattence-acceptance/bin/lattence provider list --out .
          /tmp/lattence-acceptance/bin/lattence provider enable garak --out .
          /tmp/lattence-acceptance/bin/lattence attack . --fail-on none
          /tmp/lattence-acceptance/bin/lattence report lattence-report.json
          /tmp/lattence-acceptance/bin/lattence harden lattence-report.json --fail-on none
          /tmp/lattence-acceptance/bin/lattence policy check lattence-report.json
          test -f lattence-report.html
          /tmp/lattence-acceptance/bin/lattence tui . --offline --no-color --out "$GITHUB_WORKSPACE/lattence-ui" --fail-on none > /tmp/lattence-tui.txt
          /tmp/lattence-acceptance/bin/lattence tui . --offline --json --out "$GITHUB_WORKSPACE/lattence-ui" --fail-on none > /tmp/lattence-presentation.json
          /tmp/lattence-acceptance/bin/lattence graph chain . --offline --no-color --out /tmp/lattence-chain-output > /tmp/lattence-chain.txt
          cmp "$GITHUB_WORKSPACE/lattence-ui/presentation.json" /tmp/lattence-presentation.json
          grep -q "Attack Graph" /tmp/lattence-tui.txt
          grep -q "LT-AI-002 -> LT-PQC-203" /tmp/lattence-chain.txt
          grep -q "EDGE 1      accesses  reverse" /tmp/lattence-chain.txt
          grep -q "EDGE 2      key_exchange  forward" /tmp/lattence-chain.txt
          grep -q "EVIDENCE  app.py, crypto_config.py" /tmp/lattence-chain.txt
          python "$GITHUB_WORKSPACE/tests/acceptance/check_presentation.py" "$GITHUB_WORKSPACE/lattence-ui/presentation.json" "$GITHUB_WORKSPACE/lattence-ui"
          cd ../crypto-migration
          cp tls.conf /tmp/lattence-tls-original.conf
          /tmp/lattence-acceptance/bin/lattence pqc assess . --offline --json --out /tmp/lattence-crypto-report --fail-on none > /tmp/lattence-pqc.json
          /tmp/lattence-acceptance/bin/lattence crypto chaos . --offline --json --out /tmp/lattence-crypto-report --fail-on none > /tmp/lattence-chaos.json
          cmp tls.conf /tmp/lattence-tls-original.conf
          python -c 'import json; p=json.load(open("/tmp/lattence-pqc.json")); assert p["ml_kem"]["status"] == "already_migrated" and p["hybrid_tls"]["status"] == "valid"'
          python -c 'import json; p=json.load(open("/tmp/lattence-chaos.json")); assert p["downgrade"]["status"] == "resistant" and len(p["downgrade"]["evidence"]) == 2'
          test -f /tmp/lattence-crypto-report/lattence-report.html

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan tracked files and history
        run: .githooks/check-provenance --all

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: .githooks/check-prose
