[project]
name = "lattence"
version = "0.0.0"
description = "AI security and post-quantum security assurance"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "lattence-ai",
  "lattence-api",
  "lattence-cli",
  "lattence-core",
  "lattence-crypto",
  "lattence-evidence",
  "lattence-mcp",
  "lattence-packs",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
