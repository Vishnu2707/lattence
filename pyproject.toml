[project]
name = "lattence"
version = "1.0.0"
description = "AI security and post-quantum security assurance"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai-security", "agent-security", "post-quantum-cryptography", "security-graph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=45,<51",
  "jsonschema>=4.23,<5",
  "packaging>=24,<27",
  "pathspec>=0.12,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/Vishnu2707/lattence"
Repository = "https://github.com/Vishnu2707/lattence"
Issues = "https://github.com/Vishnu2707/lattence/issues"
Changelog = "https://github.com/Vishnu2707/lattence/blob/dev/CHANGELOG.md"
Documentation = "https://github.com/Vishnu2707/lattence/tree/dev/docs"

[project.optional-dependencies]
api = ["lattence-api"]

[project.scripts]
lattence = "lattence.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "lattence-api",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6.0,<7",
  "ruff>=0.11,<1",
  "twine>=6.1,<7",
  "types-jsonschema>=4.23,<5",
  "types-pyyaml>=6.0,<7",
]

[tool.uv.workspace]
members = [
  "lattence-ai",
  "lattence-api",
  "lattence-core",
  "lattence-crypto",
  "lattence-evidence",
  "lattence-mcp",
  "lattence-packs",
]

[tool.uv.sources]
lattence = { workspace = true }
lattence-ai = { workspace = true }
lattence-api = { workspace = true }
lattence-core = { workspace = true }
lattence-crypto = { workspace = true }
lattence-evidence = { workspace = true }
lattence-mcp = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["lattence-cli/src/lattence"]

[tool.hatch.build.targets.wheel.force-include]
"lattence-core/src/lattence/discovery" = "lattence/discovery"
"lattence-core/src/lattence/graph" = "lattence/graph"
"lattence-core/src/lattence/governance" = "lattence/governance"
"lattence-evidence/src/lattence/evidence" = "lattence/evidence"
"lattence-mcp/src/lattence/mcp" = "lattence/mcp"
"lattence-ai/src/lattence_ai" = "lattence_ai"
"lattence-crypto/src/lattence_crypto" = "lattence_crypto"
"lattence-packs/attacks" = "lattence/packs/attacks"
"lattence-packs/discovery" = "lattence/packs/discovery"
"docs/schemas/report.v1.json" = "lattence/schemas/report.v1.json"
"docs/schemas/sarif-2.1.0.json" = "lattence/schemas/sarif-2.1.0.json"
"assets/brand/banner.txt" = "lattence/assets/banner.txt"
"lattence-ui/src/visual-grammar.json" = "lattence/assets/visual-grammar.json"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["lattence", "lattence_ai", "lattence_crypto"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "lattence-cli/src"
plugins = ["pydantic.mypy"]
