[project]
name = "lattence"
version = "0.0.0"
description = "AI security and post-quantum security assurance"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "lattence-ai",
  "lattence-core",
  "lattence-crypto",
  "lattence-evidence",
  "lattence-mcp",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.scripts]
lattence = "lattence.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "twine>=6.1,<7",
  "types-jsonschema>=4.23,<5",
  "types-pyyaml>=6.0,<7",
]

[tool.uv.workspace]
members = [
  "lattence-ai",
  "lattence-api",
  "lattence-core",
  "lattence-crypto",
  "lattence-evidence",
  "lattence-mcp",
  "lattence-packs",
]

[tool.uv.sources]
lattence-ai = { workspace = true }
lattence-core = { workspace = true }
lattence-crypto = { workspace = true }
lattence-evidence = { workspace = true }
lattence-mcp = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["lattence-cli/src/lattence"]

[tool.hatch.build.targets.wheel.force-include]
"lattence-packs/attacks" = "lattence/packs/attacks"
"lattence-packs/discovery" = "lattence/packs/discovery"
"docs/schemas/report.v1.json" = "lattence/schemas/report.v1.json"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
